function applyFilters(){
  filteredArticles=allArticles.filter(a=>{
    if(currentCat&&a.categoria!==currentCat)return false;
    if(currentSearch){
      const hay=(a.titulo+" "+a.resumen).toLowerCase();
      if(!hay.includes(currentSearch.toLowerCase()))return false;
    }
    return true;
  });
  currentPage=0;
  renderFeatured();
  renderGrid();
}

function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  applyFilters();
}

function onSearch(){
  currentSearch=document.getElementById("searchInput").value.trim();
  applyFilters();
}

function renderFeatured(){
  const featured=filteredArticles.filter(a=>a.destacado);
  const sec=document.getElementById("featuredSection");
  if(featured.length===0||currentSearch){sec.style.display="none";return;}
  sec.style.display="grid";
  // Main featured
  const main=featured[0];
  const mainIdx=allArticles.indexOf(main);
  const mainImg=main.imagen_url
    ?`<img src="${main.imagen_url}" class="featured-img" alt="${main.titulo}">`
    :`<div class="featured-img-ph">📰</div>`;
  document.getElementById("featuredMain").innerHTML=`
    ${mainImg}
    <div class="featured-body">
      <span class="featured-badge ${catClass(main.categoria)}">${catLabel(main.categoria)}</span>
      <div class="featured-title">${main.titulo}</div>
      <div class="featured-excerpt">${main.resumen}</div>
      <div class="featured-meta"><span>${fmtDate(main.created_at)}</span><span>✍️ ${main.autor||""}</span><span>👁 ${main.vistas||0}</span></div>
    </div>`;
  document.getElementById("featuredMain").onclick=()=>openArticle(mainIdx);
  // Side featured
  const side=featured.slice(1,4);
  document.getElementById("featuredSide").innerHTML=side.map(a=>{
    const idx=allArticles.indexOf(a);
    const sImg=a.imagen_url
      ?`<img src="${a.imagen_url}" class="side-card-img" alt="${a.titulo}">`
      :`<div class="side-card-img-ph">📄</div>`;
    return `<div class="side-card" onclick="openArticle(${idx})">${sImg}<div class="side-card-body"><div class="side-card-title">${a.titulo}</div><div class="side-card-meta">${fmtDate(a.created_at)} · ${readTime(a.contenido)}</div></div></div>`;
  }).join("");
}

function renderGrid(){
  const title=document.getElementById("gridTitle");
  const grid=document.getElementById("articlesGrid");
  const btnMore=document.getElementById("btnLoadMore");
  // Skip featured from grid when no filter
  const skip=(!currentCat&&!currentSearch)?filteredArticles.filter(a=>a.destacado).map(a=>a.id):[];
  const items=filteredArticles.filter(a=>!skip.includes(a.id));
  title.textContent=currentSearch?"Resultados de busqueda: "+items.length+" articulo"+(items.length!==1?"s":""):currentCat?"Categoria: "+catLabel(currentCat):"Todos los articulos";
  if(items.length===0){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="icon">📭</div><p>No hay articulos que coincidan.</p></div>`;btnMore.style.display="none";return;}
  const page=items.slice(0,(currentPage+1)*PAGE_SIZE);
  grid.innerHTML=page.map(a=>{
    const idx=allArticles.indexOf(a);
    const aImg=a.imagen_url
      ?`<img src="${a.imagen_url}" class="art-card-img" alt="${a.titulo}">`
      :`<div class="art-card-img-ph" style="background:rgba(255,255,255,.04)">📄</div>`;
    return `<div class="art-card" onclick="openArticle(${idx})">${aImg}<div class="art-card-body"><span class="art-cat-badge ${catClass(a.categoria)}">${catLabel(a.categoria)}</span><div class="art-title">${a.titulo}</div><div class="art-excerpt">${a.resumen}</div><div class="art-meta"><span>${fmtDate(a.created_at)}</span><span>${readTime(a.contenido)}</span></div></div></div>`;
  }).join("");
  btnMore.style.display=items.length>(currentPage+1)*PAGE_SIZE?"block":"none";
}

function loadMore(){currentPage++;renderGrid();}

function openArticle(idx){
  const a=allArticles[idx];
  if(!a)return;
  currentArticleIdx=idx;
  const overlay=document.getElementById("modalOverlay");
  document.getElementById("modalImgWrap").innerHTML=a.imagen_url
    ?`<img src="${a.imagen_url}" class="modal-img" alt="${a.titulo}">`
    :`<div class="modal-img-ph">📰</div>`;
  document.getElementById("modalCat").innerHTML=`<span class="art-cat-badge ${catClass(a.categoria)}">${catLabel(a.categoria)}</span>`;
  document.getElementById("modalTitle").textContent=a.titulo;
  document.getElementById("modalMeta").innerHTML=`<span>📅 ${fmtDate(a.created_at)}</span><span>✍️ ${a.autor||"Lomaz Home"}</span><span>⏱️ ${readTime(a.contenido)}</span><span>👁️ ${a.vistas||0} vistas</span>`;
  document.getElementById("modalBody").innerHTML=`<p>${(a.contenido||"").replace(/\n\n/g,"</p><p>")}</p>`;
  overlay.classList.add("show");
  document.body.style.overflow="hidden";
  // Increment view count
  if(a.vistas!==undefined)a.vistas++;
}

function closeModal(e){
  if(e.target===document.getElementById("modalOverlay"))closeModalDirect();
}

function closeModalDirect(){
  document.getElementById("modalOverlay").classList.remove("show");
  document.body.style.overflow="";
}

function shareArticle(){
  const a=allArticles[currentArticleIdx];
  const url=window.location.href.split("?")[0]+"?articulo="+a.id;
  if(navigator.share){navigator.share({title:a.titulo,url});return;}
  navigator.clipboard.writeText(url).then(()=>alert("Enlace copiado al portapapeles"));
}

async function init(){
  // Try to load from Supabase first
  try{
    const {data}=await sb.from("articulos").select("*").eq("publicado",true).order("created_at",{ascending:false}).limit(50);
    if(data&&data.length>0){allArticles=data;}
    else{allArticles=SEED_ARTICLES;}
  }catch(e){allArticles=SEED_ARTICLES;}
  filteredArticles=[...allArticles];
  document.getElementById("featuredSection").style.display="grid";
  applyFilters();
  // Auto-open article from URL
  const params=new URLSearchParams(window.location.search);
  const artId=params.get("articulo");
  if(artId){const idx=allArticles.findIndex(a=>a.id===artId);if(idx>=0)openArticle(idx);}
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModalDirect();});
init();
</script>
</body>
</html>
