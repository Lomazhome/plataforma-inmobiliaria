<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil del Asesor | LoMaz Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--navy:#0f2038;--gold:#b8860b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f0;color:#0f2038;}
.topbar{background:var(--navy);color:#fff;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
.topbar .logo{font-size:1.4rem;font-weight:700;}
.topbar .logo span{color:var(--gold);}
.topbar a{color:#fff;text-decoration:none;font-size:.9rem;}
.wrap{max-width:1100px;margin:0 auto;padding:32px 20px;}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:36px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
.hero .foto{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);background:#1a2f4d;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--gold);}
.hero h1{font-size:2rem;margin-bottom:6px;}
.hero .rol{color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:1px;font-size:.85rem;margin-bottom:14px;}
.hero .contacto{font-size:.95rem;line-height:1.8;}
.hero .contacto b{color:var(--gold);}
.hero .bio{margin-top:12px;font-size:.92rem;opacity:.9;max-width:520px;}
.cta{display:inline-block;margin-top:14px;background:var(--gold);color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none;font-weight:600;}
h2.sec{margin:38px 0 18px;font-size:1.5rem;border-left:4px solid var(--gold);padding-left:12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.08);transition:transform .2s;}
.card:hover{transform:translateY(-4px);}
.card .ph{height:190px;background:#dfe3e8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#9aa3ad;}
.card .body{padding:16px;}
.card .title{font-weight:700;font-size:1.05rem;margin-bottom:6px;}
.card .loc{color:#667085;font-size:.85rem;margin-bottom:10px;}
.card .price{color:var(--gold);font-weight:700;font-size:1.15rem;}
.card a.ver{display:inline-block;margin-top:12px;color:var(--navy);font-weight:600;text-decoration:none;border:1px solid var(--navy);padding:7px 16px;border-radius:7px;font-size:.85rem;}
.empty{text-align:center;color:#667085;padding:50px;}
.foot{text-align:center;color:#667085;padding:30px;font-size:.85rem;}
</style>
</head>
<body>
<div class="topbar">
<div class="logo">LoMaz<span>Home</span></div>
<a href="propiedades.html">&larr; Ver todo el portafolio</a>
</div>
<div class="wrap">
<div id="hero" class="hero"><div style="width:100%;text-align:center;color:#fff">Cargando perfil...</div></div>
<h2 class="sec">Propiedades de este asesor</h2>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">Este asesor a&uacute;n no tiene propiedades publicadas.</div>
</div>
<div class="foot">LoMaz Home Inmobiliaria &middot; (57) 300 330 0343 &middot; www.lomazhome.com</div>
<script>
const OFICINA_TEL = "300 330 0343";
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const params = new URLSearchParams(window.location.search);
const asesorId = params.get("id");
function esc(s){return (s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]));}
async function cargar(){
  if(!asesorId){ document.getElementById("hero").innerHTML='<div style="color:#fff">Asesor no especificado.</div>'; return; }
    const { data: perf } = await sb.from("perfiles_usuarios").select("id,nombre_completo,telefono,avatar_url,notas,rol_id").eq("id",asesorId).maybeSingle();
      const { data: roles } = await sb.from("roles").select("id,nombre");
        const rmap={}; (roles||[]).forEach(r=>rmap[r.id]=r.nombre);
          const nombre = perf? perf.nombre_completo : "Asesor LoMaz Home";
            const rolN = perf&&perf.rol_id? (rmap[perf.rol_id]||"Asesor") : "Asesor";
              const foto = perf&&perf.avatar_url ? `<img class="foto" src="${esc(perf.avatar_url)}" alt="${esc(nombre)}">` : `<div class="foto">&#128100;</div>`;
                const bio = perf&&perf.notas ? `<div class="bio">${esc(perf.notas)}</div>` : "";
                  const waNum = "573003300343";
                    document.getElementById("hero").innerHTML = foto +
                        `<div><h1>${esc(nombre)}</h1><div class="rol">${esc(rolN)}</div>`+
                            `<div class="contacto"><div><b>Oficina LoMaz Home:</b> (57) ${OFICINA_TEL}</div></div>`+
                                bio +
                                    `<a class="cta" href="https://wa.me/${waNum}" target="_blank">Contactar por WhatsApp</a></div>`;
                                      document.title = nombre + " | LoMaz Home";
                                        const { data: props } = await sb.from("propiedades").select("id,titulo,precio,ciudad,barrio,foto_principal,fotos,estado,tipo_negocio").eq("asesor_id",asesorId).eq("estado","activa").order("created_at",{ascending:false});
                                          const grid=document.getElementById("grid");
                                            if(!props || !props.length){ document.getElementById("empty").style.display="block"; return; }
                                              grid.innerHTML = props.map(p=>{
                                                  const img = p.foto_principal || (p.fotos && p.fotos[0]) || "";
                                                      const ph = img ? `<div class="ph" style="background-image:url('${esc(img)}')"></div>` : `<div class="ph">&#127968;</div>`;
                                                          const precio = "$" + Number(p.precio||0).toLocaleString("es-CO");
                                                              const loc = [p.barrio,p.ciudad].filter(Boolean).join(", ");
                                                                  return `<div class="card">${ph}<div class="body"><div class="title">${esc(p.titulo||"Propiedad")}</div><div class="loc">${esc(loc)}</div><div class="price">${precio}</div><a class="ver" href="propiedad.html?id=${p.id}">Ver detalle</a></div></div>`;
                                                                    }).join("");
                                                                    }
                                                                    cargar();
                                                                    </script>
                                                                    </body>
                                                                    </html>
