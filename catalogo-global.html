<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Catalogo Global | Lomaz Home</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--navy:#0D1B2E;--navy-2:#162540;--navy-3:#1d2e4d;
--gold:#c9a96e;--gold-d:#a07840;--gold-1:#e8d5b0;
--line:rgba(255,255,255,.10);--line-strong:rgba(201,169,110,.35);
--txt:#f5f1ea;--txt-soft:#a8a29e;--txt-mute:#6b6660;
--serif:'Cormorant Garamond',Georgia,serif;
--sans:'Inter',system-ui,-apple-system,sans-serif;
--sh-card:0 8px 32px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--navy);color:var(--txt);min-height:100vh}
a{color:inherit;text-decoration:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--navy-2);position:sticky;top:0;z-index:20}
.brand{font-family:var(--serif);font-size:1.5rem;font-weight:700;letter-spacing:.5px}
.brand span{color:var(--gold)}
.btn-back{background:transparent;border:1px solid var(--line-strong);color:var(--txt);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem}
.btn-back:hover{background:var(--navy-3)}
.wrap{max-width:1280px;margin:0 auto;padding:32px 28px 80px}
.h-title{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin-bottom:6px}
.h-title em{color:var(--gold);font-style:italic}
.h-sub{color:var(--txt-soft);font-size:.95rem;margin-bottom:8px}
.ro-badge{display:inline-block;background:rgba(201,169,110,.14);color:var(--gold-1);border:1px solid var(--line-strong);font-size:.72rem;padding:3px 10px;border-radius:999px;margin-bottom:24px}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px}
.filters input,.filters select{background:var(--navy-2);border:1px solid var(--line);color:var(--txt);padding:10px 14px;border-radius:10px;font-size:.88rem;font-family:var(--sans)}
.filters input{flex:1;min-width:220px}
.filters input::placeholder{color:var(--txt-mute)}
.count{color:var(--txt-soft);font-size:.82rem;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-card);border-color:var(--line-strong)}
.card-img{position:relative;aspect-ratio:4/3;background:var(--navy-3);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--txt-mute);font-size:2rem}
.chip-est{position:absolute;top:10px;left:10px;font-size:.68rem;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;text-transform:capitalize;backdrop-filter:blur(4px)}
.chip-op{position:absolute;top:10px;right:10px;font-size:.68rem;padding:4px 10px;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:600;text-transform:capitalize}
.card-body{padding:16px}
.card-title{font-family:var(--serif);font-size:1.15rem;font-weight:600;margin-bottom:4px;line-height:1.25}
.card-loc{font-size:.78rem;color:var(--txt-soft);margin-bottom:12px}
.card-price{font-size:1.1rem;font-weight:700;color:var(--gold-1);margin-bottom:12px}
.card-specs{display:flex;gap:16px;font-size:.76rem;color:var(--txt-soft);border-top:1px solid var(--line);padding-top:12px}
.card-asesor{margin-top:12px;font-size:.75rem;color:var(--gold-d);font-weight:600}
.empty{text-align:center;padding:80px 20px;color:var(--txt-soft)}
.empty .ic{font-size:3rem;display:block;margin-bottom:12px}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.78);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:40px 16px}
.overlay.open{display:flex}
.modal{background:var(--navy-2);border:1px solid var(--line-strong);border-radius:16px;max-width:760px;width:100%;overflow:hidden;box-shadow:var(--sh-card)}
.modal-hero{position:relative;aspect-ratio:16/9;background:var(--navy-3)}
.modal-hero img{width:100%;height:100%;object-fit:cover}
.modal-hero .noimg{display:flex;align-items:center;justify-content:center;height:100%;color:var(--txt-mute);font-size:3rem}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:1.2rem;cursor:pointer}
.modal-close:hover{background:rgba(0,0,0,.8)}
.modal-body{padding:24px}
.m-title{font-family:var(--serif);font-size:1.6rem;font-weight:700;margin-bottom:4px}
.m-loc{color:var(--txt-soft);font-size:.85rem;margin-bottom:12px}
.m-price{font-size:1.5rem;font-weight:700;color:var(--gold-1);margin-bottom:18px}
.m-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.m-badge{font-size:.72rem;padding:4px 12px;border-radius:999px;background:var(--navy-3);border:1px solid var(--line);text-transform:capitalize}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:20px}
.m-item{background:var(--navy-3);border:1px solid var(--line);border-radius:10px;padding:12px}
.m-item .lbl{font-size:.68rem;color:var(--txt-mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.m-item .val{font-size:.95rem;font-weight:600}
.m-section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:18px 0 8px}
.m-desc{font-size:.9rem;line-height:1.6;color:var(--txt-soft);white-space:pre-wrap}
.m-asesor{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--txt-soft)}
.m-asesor b{color:var(--gold-1)}
.loading{text-align:center;padding:80px;color:var(--txt-soft)}
.ro-note{margin-top:18px;font-size:.75rem;color:var(--txt-mute);font-style:italic;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <a href="dashboard.html" class="brand">LoMaz <span>Home</span></a>
  <button class="btn-back" onclick="location.href='dashboard.html'">&larr; Dashboard</button>
</div>
<div class="wrap">
  <h1 class="h-title">Catalogo <em>Global</em></h1>
  <p class="h-sub">Inventario completo de propiedades de toda la plataforma.</p>
  <span class="ro-badge">&#128065; Solo lectura</span>
  <div class="filters">
    <input id="q" type="text" placeholder="Buscar por titulo, ciudad o barrio..." oninput="applyFilters()">
    <select id="fOp" onchange="applyFilters()"><option value="">Toda operacion</option><option value="venta">Venta</option><option value="arriendo">Arriendo</option></select>
    <select id="fTipo" onchange="applyFilters()"><option value="">Todo tipo</option></select>
    <select id="fEst" onchange="applyFilters()"><option value="">Todo estado</option></select>
  </div>
  <div class="count" id="count"></div>
  <div id="grid" class="grid"><div class="loading">Cargando propiedades...</div></div>
</div>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<script>
const K = atob("93,95,107,76,102,64,77,79,94,53,107,87,102,82,119,77,81,95,119,77,74,82,50,119,84,95,73,77,101,107,78,54,94,55,73,77,73,108,107,117,100,65,111,80,86,55,104,50,75,106,81,50,84,105,69,109,74,55,54,119,83,53,107,76,98,106,85,94,86,106,111,93,101,82,93,49,80,107,73,77,100,55,107,114,84,106,127,102,102,82,108,53,84,80,54,51,99,80,65,95,72,83,65,102,81,55,119,52,93,65,111,80,74,80,73,95,83,109,69,109,101,80,86,55,94,109,77,116,74,55,107,119,99,53,107,109,101,83,107,125,80,107,73,77,73,108,107,115,85,105,81,110,74,109,85,119,83,66,73,76,100,65,107,94,82,80,107,87,102,108,82,125,83,105,119,105,99,55,62,66,83,83,81,72,102,106,99,125,84,80,54,80,73,64,73,67,84,83,93,73,102,108,66,54,83,95,119,93,74,82,62,82,102,125,77,87,84,67,70,114,72,79,100,115,81,64,73,66,72,66,119,75,102,55,111,85,100,64,50,50,94,106,65,118,75,82,65,72,98,110,55,55,102,125,85,104,98,106,50,64,101,55,107,52,85,105,77,97,80,106,65,55,100,81,69,55,86,86,58,58".split(',').map(function(n){return String.fromCharCode((n|0)^7);}).join(''));
const U = "https://lniouebpuuuqctrgxoiw.supabase.co";
const sb = supabase.createClient(U, K);
let ALL=[], PERFS={};
function fmtPrice(v){ if(v===null||v===undefined||v==='')return 'Consultar'; const n=Number(v); if(isNaN(n))return 'Consultar'; return '$ '+n.toLocaleString('es-CO'); }
function cap(s){ return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):''; }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function opOf(p){ return p.tipo_operacion||p.tipo_negocio||''; }
async function load(){
  try{
    const {data,error} = await sb.from('propiedades')
      .select('id,titulo,descripcion,tipo_operacion,tipo_negocio,tipo_propiedad,subtipo,estado,precio,moneda,ciudad,barrio,direccion,area_construida,area_total,habitaciones,banos,parqueaderos,estrato,administracion,foto_principal,asesor_id,created_at')
      .order('created_at',{ascending:false});
    if(error) throw error;
    ALL = data||[];
    const ids=[...new Set(ALL.map(function(p){return p.asesor_id;}).filter(Boolean))];
    if(ids.length){
      const {data:perfs} = await sb.from('perfiles_usuarios').select('id,nombre_completo').in('id',ids);
      (perfs||[]).forEach(function(a){ PERFS[a.id]=a.nombre_completo; });
    }
    buildFilterOptions();
    applyFilters();
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty"><span class="ic">&#10060;</span>Error al cargar: '+esc(e.message)+'</div>';
  }
}
function buildFilterOptions(){
  const tipos=[...new Set(ALL.map(function(p){return p.tipo_propiedad;}).filter(Boolean))].sort();
  const ests=[...new Set(ALL.map(function(p){return p.estado;}).filter(Boolean))].sort();
  const ft=document.getElementById('fTipo'), fe=document.getElementById('fEst');
  tipos.forEach(function(t){ const o=document.createElement('option'); o.value=t; o.textContent=cap(t); ft.appendChild(o); });
  ests.forEach(function(t){ const o=document.createElement('option'); o.value=t; o.textContent=cap(t); fe.appendChild(o); });
}
function applyFilters(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const op=document.getElementById('fOp').value.toLowerCase();
  const tp=document.getElementById('fTipo').value.toLowerCase();
  const es=document.getElementById('fEst').value.toLowerCase();
  const list=ALL.filter(function(p){
    const mQ=!q||[p.titulo,p.ciudad,p.barrio].some(function(x){return (x||'').toLowerCase().includes(q);});
    const mOp=!op||(opOf(p)||'').toLowerCase().includes(op);
    const mTp=!tp||(p.tipo_propiedad||'').toLowerCase()===tp;
    const mEs=!es||(p.estado||'').toLowerCase()===es;
    return mQ&&mOp&&mTp&&mEs;
  });
  render(list);
}
function render(list){
  const g=document.getElementById('grid');
  document.getElementById('count').textContent=list.length+' propiedad'+(list.length===1?'':'es');
  if(!list.length){ g.innerHTML='<div class="empty"><span class="ic">&#127968;</span>No hay propiedades que coincidan.</div>'; return; }
  g.innerHTML=list.map(function(p){
    const img=p.foto_principal?'<img src="'+esc(p.foto_principal)+'" alt="" onerror="this.parentNode.innerHTML=\'<div class=noimg>&#127968;</div>\'">':'<div class="noimg">&#127968;</div>';
    const op=opOf(p);
    const specs=[];
    if(p.habitaciones)specs.push(p.habitaciones+' hab');
    if(p.banos)specs.push(p.banos+' ba&ntilde;os');
    if(p.area_construida)specs.push(p.area_construida+' m&sup2;');
    return '<div class="card" onclick="openModal('+p.id+')">'
      +'<div class="card-img">'+img
        +(p.estado?'<span class="chip-est">'+esc(cap(p.estado))+'</span>':'')
        +(op?'<span class="chip-op">'+esc(cap(op))+'</span>':'')
      +'</div>'
      +'<div class="card-body">'
        +'<div class="card-title">'+esc(p.titulo||'Sin titulo')+'</div>'
        +'<div class="card-loc">'+esc([p.barrio,p.ciudad].filter(Boolean).join(', ')||'Ubicacion no especificada')+'</div>'
        +'<div class="card-price">'+fmtPrice(p.precio)+'</div>'
        +(specs.length?'<div class="card-specs">'+specs.map(function(s){return '<span>'+s+'</span>';}).join('')+'</div>':'')
        +'<div class="card-asesor">'+esc(PERFS[p.asesor_id]||'Sin asignar')+'</div>'
      +'</div>'
    +'</div>';
  }).join('');
}
function openModal(id){
  const p=ALL.find(function(x){return x.id===id;});
  if(!p)return;
  const img=p.foto_principal?'<img src="'+esc(p.foto_principal)+'" alt="">':'<div class="noimg">&#127968;</div>';
  const op=opOf(p);
  const badges=[op,p.tipo_propiedad,p.subtipo,p.estado].filter(Boolean).map(function(b){return '<span class="m-badge">'+esc(cap(b))+'</span>';}).join('');
  const items=[];
  function it(l,v){ if(v!==null&&v!==undefined&&v!=='')items.push('<div class="m-item"><div class="lbl">'+l+'</div><div class="val">'+esc(v)+'</div></div>'); }
  it('Habitaciones',p.habitaciones); it('Ba&ntilde;os',p.banos); it('Parqueaderos',p.parqueaderos);
  it('Area construida',p.area_construida?p.area_construida+' m&sup2;':''); it('Area total',p.area_total?p.area_total+' m&sup2;':'');
  it('Estrato',p.estrato); it('Administracion',p.administracion?fmtPrice(p.administracion):'');
  const m=document.getElementById('modal');
  m.innerHTML='<div class="modal-hero">'+img+'<button class="modal-close" onclick="closeModal()">&times;</button></div>'
    +'<div class="modal-body">'
      +'<div class="m-title">'+esc(p.titulo||'Sin titulo')+'</div>'
      +'<div class="m-loc">'+esc([p.direccion,p.barrio,p.ciudad].filter(Boolean).join(', ')||'Ubicacion no especificada')+'</div>'
      +'<div class="m-price">'+fmtPrice(p.precio)+'</div>'
      +(badges?'<div class="m-badges">'+badges+'</div>':'')
      +(items.length?'<div class="m-grid">'+items.join('')+'</div>':'')
      +(p.descripcion?'<div class="m-section-title">Descripcion</div><div class="m-desc">'+esc(p.descripcion)+'</div>':'')
      +'<div class="m-asesor">Publicado por <b>'+esc(PERFS[p.asesor_id]||'Sin asignar')+'</b></div>'
      +'<div class="ro-note">&#128065; Vista de solo lectura &mdash; para editar usa "Mis Propiedades".</div>'
    +'</div>';
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closeModal(); });
load();
</script>
</body>
  </html>
