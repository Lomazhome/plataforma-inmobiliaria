<script>
/* Esta dirección quedó reemplazada por el listado nuevo. Se conservan los filtros que venían en el enlace. */
(function(){
  var p=new URLSearchParams(location.search), q=new URLSearchParams();
  var t=(p.get("tipo")||"").toLowerCase();
  if(t==="venta"||t==="arriendo") q.set("negocio",t); else if(t) q.set("tipo",t);
  ["negocio","ciudad","barrio","precio","orden"].forEach(function(k){ if(p.get(k)) q.set(k,p.get(k)); });
  var s=q.toString();
  location.replace("propiedades-publica.html"+(s?"?"+s:""));
})();
</script>
