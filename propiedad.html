<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Detalle Propiedad | Lomaz Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--navy:#0D1B2E;--navy2:#162540;--gold:#c9a96e;--ink:#1a2438;--line:rgba(201,169,110,.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a1422;color:#e8edf5;line-height:1.6;}
.serif{font-family:'Cormorant Garamond',serif;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;}
nav.top{position:sticky;top:0;z-index:50;background:rgba(10,20,34,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:.5px;}
.brand b{color:var(--gold);}
nav.top .links{display:flex;gap:30px;align-items:center;font-size:.82rem;letter-spacing:1.5px;font-weight:600;}
nav.top .links a{color:#c5cfe0;transition:.2s;}
nav.top .links a:hover{color:var(--gold);}
.btn-login{border:1px solid var(--gold);color:var(--gold)!important;padding:8px 20px;border-radius:8px;letter-spacing:1px;}
.btn-login:hover{background:var(--gold);color:var(--navy)!important;}
.crumb{font-size:.78rem;color:#7a89a3;padding:18px 0 6px;letter-spacing:.5px;}
.crumb a:hover{color:var(--gold);}
.crumb span{color:#a9b6cd;}
.gallery{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--navy2);margin-bottom:14px;}
.gallery .main{position:relative;height:480px;background:#0b1626;display:flex;align-items:center;justify-content:center;}
.gallery .main img{width:100%;height:100%;object-fit:cover;display:block;}
.gallery .ph{font-size:84px;opacity:.5;}
.badge-op{position:absolute;top:18px;left:18px;background:var(--gold);color:var(--navy);font-weight:700;font-size:.72rem;letter-spacing:1.5px;padding:7px 16px;border-radius:8px;z-index:5;text-transform:uppercase;}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(13,27,46,.7);border:1px solid var(--line);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:.2s;}
.gnav:hover{background:var(--gold);color:var(--navy);}
.gnav.prev{left:16px;} .gnav.next{right:16px;}
.gcount{position:absolute;bottom:16px;right:16px;background:rgba(13,27,46,.8);padding:6px 14px;border-radius:20px;font-size:.78rem;letter-spacing:.5px;z-index:5;}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:30px;}
.thumbs img{width:100%;height:74px;object-fit:cover;border-radius:9px;cursor:pointer;opacity:.55;border:2px solid transparent;transition:.2s;}
.thumbs img:hover{opacity:1;}
.thumbs img.active{opacity:1;border-color:var(--gold);}
.layout{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:start;padding-bottom:60px;}
@media(max-width:920px){.layout{grid-template-columns:1fr;}}
h1.title{font-size:2.5rem;font-weight:600;line-height:1.15;margin-bottom:8px;color:#fff;}
.loc{color:#9fb0cc;font-size:1rem;margin-bottom:18px;}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 26px;}
.tag{background:var(--navy2);border:1px solid var(--line);color:#cdd8ea;font-size:.74rem;letter-spacing:1px;text-transform:uppercase;padding:6px 14px;border-radius:30px;}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--navy2);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:34px;}
.fact{padding:22px 14px;text-align:center;border-right:1px solid var(--line);}
.fact:last-child{border-right:none;}
.fact .ic{font-size:1.5rem;}
.fact .v{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:#fff;margin-top:4px;}
.fact .l{font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:#8696b2;margin-top:2px;}
@media(max-width:560px){.facts{grid-template-columns:repeat(2,1fr);}.fact:nth-child(2n){border-right:none;}}
.sec{margin-bottom:38px;}
.sec h2{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:600;color:#fff;margin-bottom:6px;}
.sec .rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:18px;}
.desc{color:#bdc9dd;font-size:1.02rem;white-space:pre-wrap;}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.specs{grid-template-columns:1fr;}}
.spec{display:flex;justify-content:space-between;align-items:center;background:var(--navy2);border:1px solid var(--line);border-radius:11px;padding:13px 18px;}
.spec .k{color:#8696b2;font-size:.82rem;letter-spacing:.5px;text-transform:uppercase;}
.spec .vv{color:#fff;font-weight:600;}
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.amen .a{display:flex;align-items:center;gap:9px;color:#cdd8ea;font-size:.92rem;background:var(--navy2);border:1px solid var(--line);border-radius:9px;padding:10px 14px;}
.amen .a::before{content:'\2713';color:var(--gold);font-weight:700;}
#map{height:330px;border-radius:14px;border:1px solid var(--line);}
.noaddr{color:#8696b2;font-style:italic;}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:18px;}
.card{background:linear-gradient(160deg,var(--navy2),var(--navy));border:1px solid var(--line);border-radius:18px;padding:26px;}
.card .price2{font-size:2rem;font-weight:700;color:var(--gold);margin-bottom:4px;}
.card .neg{font-size:.8rem;color:#8696b2;margin-bottom:18px;}
.advisor{display:flex;align-items:center;gap:13px;margin-bottom:16px;}
.advisor .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8a7038);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--navy);font-weight:700;}
.advisor .nm{font-weight:600;color:#fff;}
.advisor .rl{font-size:.76rem;color:#8696b2;letter-spacing:.5px;}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:11px;font-weight:600;font-size:.92rem;letter-spacing:.5px;cursor:pointer;border:none;transition:.2s;margin-bottom:11px;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-gold:hover{background:#d8bd88;}
.btn-wa{background:#25D366;color:#fff;}
.btn-wa:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:#cdd8ea;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.miniref{font-size:.72rem;color:#6b7a96;text-align:center;letter-spacing:1px;margin-top:6px;}
.center-msg{text-align:center;padding:120px 20px;color:#8696b2;}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 18px;}
@keyframes sp{to{transform:rotate(360deg);}}
footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:#6b7a96;font-size:.82rem;}
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <a href="/" class="brand">Lomaz<b>Home</b></a>
  <div class="links">
    <a href="/">INICIO</a>
    <a href="/propiedades.html">PROPIEDADES</a>
    <a href="/login.html" class="btn-login">Ingresar</a>
  </div>
</div></nav>
<div class="wrap">
  <div id="app"><div class="center-msg"><div class="spinner"></div>Cargando propiedad...</div></div>
</div>
<footer>&copy; <span id="yr"></span> Lomaz Home &middot; Inmobiliaria</footer>
<script>
(async function(){
  var yr=document.getElementById('yr'); if(yr) yr.textContent=new Date().getFullYear();
  var app=document.getElementById('app');
  function qp(n){return new URLSearchParams(window.location.search).get(n);}
  var ID=qp('id');
  if(!ID){app.innerHTML='<div class="center-msg">Propiedad no especificada.</div>';return;}
  var SB=null;
  try{
    var cfg=await (await fetch('/config.js')).text();
    var SURL=(cfg.match(/https:\/\/[a-z0-9]+\.supabase\.co/)||[])[0];
    var SKEY=(cfg.match(/eyJ[\w.\-]+/)||[])[0];
    SB=window.supabase.createClient(SURL,SKEY);
  }catch(e){}
  var p=null;
  try{ var r=await SB.from('propiedades').select('*').eq('id',ID).single(); p=r.data; }catch(e){}
  if(!p){app.innerHTML='<div class="center-msg">No se encontro la propiedad o no esta disponible.</div>';return;}
  function fmtPrice(n){n=Number(n)||0;if(n>=1e9)return '$'+(n/1e9).toFixed(n%1e9===0?0:1).replace('.0','')+' Mil M';if(n>=1e6)return '$'+(n/1e6).toFixed(n%1e6===0?0:1).replace('.0','')+'M';return '$'+n.toLocaleString('es-CO');}
  function full(n){return '$'+(Number(n)||0).toLocaleString('es-CO');}
  function cap(s){s=(s||'').toString();return s.charAt(0).toUpperCase()+s.slice(1);}
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  var op=(p.tipo_negocio||p.tipo_operacion||p.negocio||'venta');
  var locTxt=[p.barrio,p.ciudad,p.departamento].filter(Boolean).join(', ');
  var fotos=Array.isArray(p.fotos)?p.fotos.slice():[];
  if(!fotos.length && p.foto_principal) fotos=[p.foto_principal];
  if(!fotos.length && Array.isArray(p.imagenes)) fotos=p.imagenes.slice();
  var amen=Array.isArray(p.amenidades)?p.amenidades:[];
  var area=p.m2_construccion||p.area_construida||p.area_privada||p.m2_terreno||0;
  var galInner;
  if(fotos.length){
    galInner='<div class="main"><span class="badge-op">'+esc(op).toUpperCase()+'</span><img id="mainImg" src="'+esc(fotos[0])+'" alt="foto"/>'+(fotos.length>1?'<div class="gnav prev" onclick="GAL(-1)">&#8249;</div><div class="gnav next" onclick="GAL(1)">&#8250;</div>':'')+'<div class="gcount"><span id="gIdx">1</span> / '+fotos.length+'</div></div>';
  }else{ galInner='<div class="main"><span class="badge-op">'+esc(op).toUpperCase()+'</span><span class="ph">&#127968;</span></div>'; }
  var thumbs='';
  if(fotos.length>1){ thumbs='<div class="thumbs">'+fotos.map(function(f,i){return '<img src="'+esc(f)+'" class="'+(i===0?'active':'')+'" onclick="GAL_SET('+i+')"/>';}).join('')+'</div>'; }
  var specRows=[
    ['Tipo', cap(p.tipo_propiedad||p.tipo||'-')],['Negocio', cap(op)],['Estrato', p.estrato||'-'],['Piso', (p.piso!=null?p.piso:'-')],
    ['Area construida', (p.m2_construccion||p.area_construida)?((p.m2_construccion||p.area_construida)+' m\u00b2'):'-'],
    ['Area privada', p.area_privada?(p.area_privada+' m\u00b2'):'-'],['Area terreno', p.m2_terreno?(p.m2_terreno+' m\u00b2'):'-'],
    ['Habitaciones', (p.habitaciones!=null?p.habitaciones:'-')],['Banos', (p.banos!=null?p.banos:'-')],
    ['Garajes', (p.garajes!=null?p.garajes:(p.parqueaderos!=null?p.parqueaderos:'-'))],
    ['Antiguedad', (p.antiguedad!=null?p.antiguedad+' anos':(p.edad_inmueble!=null?p.edad_inmueble:'-'))],
    ['Tipo de piso', cap(p.tipo_piso||'-')],['Administracion', (p.administracion||p.precio_admin)?full(p.administracion||p.precio_admin):'-'],
    ['Acepta creditos', p.acepta_creditos?'Si':'No'],['Acepta mascotas', p.acepta_mascotas?'Si':'No'],
    ['Estado', cap(p.estado||p.estado_propiedad||'-')]
  ].filter(function(r){return r[1]!=='-' && r[1]!=='' && r[1]!=null;});
  var specsHtml=specRows.map(function(r){return '<div class="spec"><span class="k">'+esc(r[0])+'</span><span class="vv">'+esc(r[1])+'</span></div>';}).join('');
  var amenHtml = amen.length? '<div class="sec"><h2>Amenidades</h2><div class="rule"></div><div class="amen">'+amen.map(function(a){return '<div class="a">'+esc(a)+'</div>';}).join('')+'</div></div>' : '';
  var hasGeo = p.latitud && p.longitud && !p.ocultar_mapa;
  var addrLine = p.ocultar_calle? '' : (p.direccion||p.calle_carrera||'');
  var mapHtml = hasGeo ? '<div class="sec"><h2>Ubicacion</h2><div class="rule"></div>'+(addrLine?'<p class="desc" style="margin-bottom:14px">\ud83d\udccd '+esc(addrLine)+'</p>':'')+'<div id="map"></div></div>' : '<div class="sec"><h2>Ubicacion</h2><div class="rule"></div><p class="noaddr">'+esc(locTxt||'Ubicacion no disponible')+'</p></div>';
  var waMsg=encodeURIComponent('Hola, estoy interesado en la propiedad: '+(p.titulo||'')+' ('+window.location.href+')');
  var sideHtml='<div class="side"><div class="card"><div class="price2">'+fmtPrice(p.precio)+'</div><div class="neg">'+full(p.precio)+(p.precio_negociable?' \u00b7 Negociable':'')+'</div><div class="advisor"><div class="av">LH</div><div><div class="nm">Asesor Lomaz Home</div><div class="rl">Inmobiliaria Lomaz</div></div></div><a class="btn btn-wa" target="_blank" href="https://wa.me/?text='+waMsg+'">Contactar por WhatsApp</a><button class="btn btn-gold" onclick="DESCARGAR()">Descargar Ficha Tecnica (PDF)</button><button class="btn btn-ghost" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):(navigator.clipboard.writeText(location.href),alert(\'Enlace copiado\'))">Compartir</button><div class="miniref">REF: LH-'+esc(p.codigo_interno||p.id)+'</div></div></div>';
  app.innerHTML=
    '<div class="crumb"><a href="/">Inicio</a> \u203a <a href="/propiedades.html">Propiedades</a> \u203a <span>'+esc(p.titulo||'')+'</span></div>'+
    '<div class="gallery">'+galInner+'</div>'+thumbs+
    '<div class="layout"><div class="content">'+
      '<h1 class="title serif">'+esc(p.titulo||'')+'</h1>'+
      '<div class="loc">\ud83d\udccd '+esc(locTxt)+'</div>'+
      '<div class="tags"><span class="tag">'+esc(op)+'</span><span class="tag">'+esc(p.tipo_propiedad||p.tipo||'')+'</span>'+(p.estado?'<span class="tag">'+esc(p.estado)+'</span>':'')+'</div>'+
      '<div class="facts">'+
        '<div class="fact"><div class="ic">\ud83d\udecf\ufe0f</div><div class="v">'+(p.habitaciones||0)+'</div><div class="l">Habitaciones</div></div>'+
        '<div class="fact"><div class="ic">\ud83d\udec1</div><div class="v">'+(p.banos||0)+'</div><div class="l">Banos</div></div>'+
        '<div class="fact"><div class="ic">\ud83d\ude97</div><div class="v">'+(p.garajes||p.parqueaderos||0)+'</div><div class="l">Garajes</div></div>'+
        '<div class="fact"><div class="ic">\ud83d\udcd0</div><div class="v">'+(area||0)+'</div><div class="l">m\u00b2 Area</div></div>'+
      '</div>'+
      (p.descripcion?'<div class="sec"><h2>Descripcion</h2><div class="rule"></div><div class="desc">'+esc(p.descripcion)+'</div></div>':'')+
      '<div class="sec"><h2>Caracteristicas</h2><div class="rule"></div><div class="specs">'+specsHtml+'</div></div>'+
      amenHtml+ mapHtml+
    '</div>'+sideHtml+'</div>';
  var gi=0;
  window.GAL=function(d){GAL_SET((gi+d+fotos.length)%fotos.length);};
  window.GAL_SET=function(i){gi=i;var im=document.getElementById('mainImg');if(im)im.src=fotos[i];var gx=document.getElementById('gIdx');if(gx)gx.textContent=(i+1);document.querySelectorAll('.thumbs img').forEach(function(t,k){t.classList.toggle('active',k===i);});};
  if(hasGeo && window.L){
    try{ var map=L.map('map',{scrollWheelZoom:false}).setView([p.latitud,p.longitud],15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap'}).addTo(map); L.marker([p.latitud,p.longitud]).addTo(map); setTimeout(function(){map.invalidateSize();},300); }catch(e){}
  }
  window.DESCARGAR=async function(){
    var btn=document.querySelector('.btn-gold'); var prev=btn?btn.textContent:''; if(btn){btn.textContent='Generando PDF...';btn.disabled=true;}
    async function toDU(u){try{var r=await fetch(u,{mode:'cors'});var b=await r.blob();return await new Promise(function(rs){var f=new FileReader();f.onload=function(){rs(f.result);};f.onerror=function(){rs('');};f.readAsDataURL(b);});}catch(e){return '';}}
    var DU=[]; var list=(fotos&&fotos.length)?fotos.slice(0,12):[];
    for(var i=0;i<list.length;i++){var d=await toDU(list[i]); if(d)DU.push(d);}
    var rows=specRows.map(function(r){return '<tr><td style="color:#666;padding:7px 14px;border-bottom:1px solid #eee">'+esc(r[0])+'</td><td style="padding:7px 14px;border-bottom:1px solid #eee;font-weight:700;text-align:right">'+esc(r[1])+'</td></tr>';}).join('');
    var amenHtml=''; if(amenList&&amenList.length){amenHtml='<h3 style="color:#0D1B2E;border-bottom:2px solid #c9a96e;padding-bottom:6px;font-size:14px;margin-top:18px">AMENIDADES</h3><div style="columns:3;font-size:12px;color:#444;line-height:1.9">'+amenList.map(function(a){return '<div>\u2713 '+esc(a)+'</div>';}).join('')+'</div>';}
    var fotoHdr=DU[0]?'<img src="'+DU[0]+'" style="width:100%;height:300px;object-fit:cover;border-radius:8px;margin-bottom:16px">':'';
    var catalog=DU.slice(1).map(function(u){return '<div style="width:48%;display:inline-block;margin:1%;height:160px;border-radius:6px;overflow:hidden;background:#eee;vertical-align:top"><img src="'+u+'" style="width:100%;height:100%;object-fit:cover"></div>';}).join('');
    var catHtml=catalog?'<h3 style="color:#0D1B2E;border-bottom:2px solid #c9a96e;padding-bottom:6px;font-size:14px;margin-top:18px">CATALOGO DE FOTOS</h3><div style="text-align:center">'+catalog+'</div>':'';
    var loc=[p.barrio,p.ciudad,p.departamento].filter(Boolean).map(esc).join(', ');
    var precioTxt=(p.precio!=null)?('$'+Number(p.precio).toLocaleString('es-CO')):'';
    var ficha=document.createElement('div');
    ficha.style.cssText='width:760px;padding:34px;font-family:Arial,sans-serif;color:#222;background:#fff;position:relative';
    ficha.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #c9a96e;padding-bottom:14px;margin-bottom:18px"><div style="font-size:24px;font-weight:800;color:#0D1B2E">LoMaz<span style="color:#c9a96e">Home</span></div><div style="text-align:right;font-size:11px;color:#888">FICHA TECNICA<br>REF: '+esc(p.codigo_interno||('LH-'+p.id))+'</div></div>'
      +fotoHdr
      +'<h1 style="font-size:22px;color:#0D1B2E;margin:0 0 4px">'+esc(p.titulo||'Propiedad')+'</h1>'
      +(loc?'<div style="color:#777;margin-bottom:6px">\ud83d\udccd '+loc+'</div>':'')
      +(precioTxt?'<div style="font-size:26px;font-weight:800;color:#c9a96e;margin-bottom:16px">'+precioTxt+'</div>':'')
      +'<h3 style="color:#0D1B2E;border-bottom:2px solid #c9a96e;padding-bottom:6px;font-size:14px">CARACTERISTICAS</h3>'
      +'<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:18px">'+rows+'</table>'
      +(p.descripcion?'<h3 style="color:#0D1B2E;border-bottom:2px solid #c9a96e;padding-bottom:6px;font-size:14px">DESCRIPCION</h3><p style="font-size:13px;line-height:1.6;color:#444;margin-bottom:6px">'+esc(p.descripcion)+'</p>':'')
      +amenHtml
      +catHtml
      +'<div style="margin-top:24px;border-top:1px solid #eee;padding-top:12px;font-size:10px;color:#888;text-align:center">Propiedad sujeta a disponibilidad. Precio sujeto a cambios sin previo aviso. La informacion y medidas son aproximadas. LoMaz Home \u00b7 Inmobiliaria \u00b7 Generado '+new Date().toLocaleDateString('es-CO')+'</div>';
    document.body.appendChild(ficha);
    try{ var imgs=Array.prototype.slice.call(ficha.querySelectorAll('img')); await Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve();})); }catch(e){}
    await new Promise(function(r){setTimeout(r,250);});
    var fn='Ficha-LH-'+(p.codigo_interno||p.id)+'.pdf';
    try{ await window.html2pdf().set({margin:[8,8,8,8],filename:fn,image:{type:'jpeg',quality:.92},html2canvas:{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(ficha).save(); }catch(e){ alert('No se pudo generar la ficha: '+e.message); }
    ficha.remove();
    if(btn){btn.textContent=prev;btn.disabled=false;}
  };
  document.title=(p.titulo||'Propiedad')+' | Lomaz Home';
})();
</script>
