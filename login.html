<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ingresar - Lomaz Home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Montserrat,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.login-box{width:100%;max-width:400px;background:#111;border:1px solid #222;border-radius:16px;padding:2.5rem 2rem;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:2rem}
.logo h1{font-size:1.6rem;font-weight:900;letter-spacing:3px;color:#c9a484}
.logo p{color:#666;font-size:.8rem;margin-top:.3rem;letter-spacing:1px;text-transform:uppercase}
h2{font-size:1.2rem;font-weight:700;margin-bottom.2rem;text-align:center}
.form-group{margin-bottom:1.2rem}
label{display:block;font-size:.75rem;color:#aaa;font-weight:600;letter-spacing:.5px;margin-bottom:.4rem;text-transform:uppercase}
input{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:.8rem 1rem;color:#fff;font-family:Montserrat,sans-serif;font-size:.95rem;outline:none;transition:.3s}
input:focus{border-color:#c9a484;background:#1f1a0f}
.btn-login{width:100%;background:#c9a484;color:#000;border:none;border-radius:8px;padding:1rem;font-family:Montserrat,sans-serif;font-weight:800;font-size:.95rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:.3s;margin-top:.5rem}
.btn-login:hover{background:#b8956d;transform:translateY(-1px)}
.btn-login:disabled{background:#444;cursor:not-allowed;transform:none}
.alert{padding:.8rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;margin-bottom:1rem;display:none;text-align:center}
.alert.error{background:rgba(220,53,69,.15);border:1px solid rgba(220,53,69,.4);color:#ff6b7a;display:block}
.alert.success{background:rgba(40,167,69,.15);border:1px solid rgba(40,167,69,.4);color:#5dd879;display:block}
.alert.info{background:rgba(201,164,132,.1);border:1px solid rgba(201,164,132,.3);color:#c9a484;display:block}
.forgot{text-align:center;margin-top:1rem}
.forgot a{color:#888;font-size:.8rem;text-decoration:none;transition:.3s}
.forgot a:hover{color:#c9a484}
.divider{border:none;border-top:1px solid #1f1f1f;margin:1.5rem 0}
.no-register{background:rgba(201,164,132,.05);border:1px solid rgba(201,164,132,.15);border-radius:8px;padding:1rem;text-align:center}
.no-register p{font-size:.8rem;color:#888;line-height:1.6}
.no-register strong{color:#c9a484}
.back-link{text-align:center;margin-top:1.5rem}
.back-link a{color:#666;font-size:.8rem;text-decoration:none}
.back-link a:hover{color:#c9a484}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="login-box">
<div class="logo"><h1>LOMAZ HOME</h1><p>Plataforma Inmobiliaria</p></div>
<div id="alert" class="alert"></div>
<div class="form-group"><label>Correo electronico</label><input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" onkeydown="if(event.key==='Enter')login()"/></div>
<div class="form-group"><label>Contrasena</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"/></div>
<button class="btn-login" id="btnLogin" onclick="login()">Ingresar</button>
<div class="forgot"><a href="#" onclick="resetPassword()">¿Olvidaste tu contrasena?</a></div>
<hr class="divider"/>
<div class="no-register">
<p>🔒 <strong>Acceso restringido</strong><br/>El registro de nuevos usuarios es gestionado exclusivamente por el administrador de la plataforma.<br/><br/>Si eres asesor y necesitas acceso, contacta al administrador.</p>
</div>
<div class="back-link"><a href="/">← Volver al inicio</a></div>
</div>
<script>
const SURL="https://lniouebpuuuqctrgxoiw.supabase.co";
const SKEY=atob("ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW14dWFXOTFaV0p3ZFhWMWNXTjBjbWQ0YjJsM0lpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzTnpnd09ETTVOamdzSW1WNGNDSTZNakE1TXpZMU9UazJPSDAuOHctVGNEOEpLa0hRcG55YmFqLUFOei00azRoem5Gb0l3RnJfWmF0cVB0QQ==");
const sb=window.supabase.createClient(SURL,SKEY);

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(session){window.location.href="dashboard.html";return;}
})();

async function login(){
  const email=document.getElementById("email").value.trim();
  const pass=document.getElementById("password").value;
  if(!email||!pass){showAlert("Completa todos los campos","error");return;}
  const btn=document.getElementById("btnLogin");
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Verificando...';
  hideAlert();
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){
    let msg="Credenciales incorrectas. Verifica tu correo y contrasena.";
    if(error.message.includes("Email not confirmed"))msg="Debes confirmar tu correo electronico primero.";
    if(error.message.includes("Invalid login"))msg="Correo o contrasena incorrectos.";
    showAlert(msg,"error");
    btn.disabled=false;btn.innerHTML="Ingresar";
    return;
  }
  showAlert("Bienvenido! Redirigiendo...","success");
  setTimeout(()=>window.location.href="dashboard.html",800);
}

async function resetPassword(){
  const email=document.getElementById("email").value.trim();
  if(!email){showAlert("Ingresa tu correo electronico primero","error");return;}
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+"/login.html"});
  if(error)showAlert("Error al enviar: "+error.message,"error");
  else showAlert("Correo de recuperacion enviado. Revisa tu bandeja de entrada.","success");
}

function showAlert(msg,type){const a=document.getElementById("alert");a.className="alert "+type;a.textContent=msg;}
function hideAlert(){document.getElementById("alert").style.display="none";}
</script>
</body>
</html>
