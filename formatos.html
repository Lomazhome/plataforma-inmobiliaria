<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>

<title>Formatos | Lomaz Home</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== Tokens LoMaz ===== */
:root{--navy:#0D1B2E;--navy-2:#162540;--navy-3:#1d2e4d;--gold:#c9a96e;--gold-d:#a07840;--gold-l:#e8d5b0;--line:rgba(255,255,255,.10);--line-strong:rgba(201,169,110,.35);--txt:#f5f1ea;--txt-soft:#a8a29e;--txt-mute:#8d877f;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--expo:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--navy);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.6}
/* ===== Barra superior (la misma del panel) ===== */
.topbar{position:fixed;top:0;width:100%;z-index:100;background:linear-gradient(180deg,#0A1626 0%,#0D1B2E 100%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
.brand{display:flex;align-items:center;gap:.85rem;text-decoration:none}.brand-svg{width:42px;height:42px;flex-shrink:0}.brand-text{font-family:var(--serif);font-size:1.55rem;font-weight:500;letter-spacing:.5px;line-height:1}.brand-text .lo{color:var(--gold)}.brand-text .ho{color:#fff;font-family:var(--sans);font-size:.78rem;letter-spacing:6px;font-weight:400;display:block;margin-top:2px;text-transform:uppercase}.user-email{font-size:.88rem;color:var(--txt);font-weight:500;line-height:1.2}.user-role{font-size:.72rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-top:2px}.btn-back{background:transparent;border:1px solid var(--line);color:var(--txt-soft);padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:500;letter-spacing:.5px;transition:all .25s ease;font-family:var(--sans);text-decoration:none;white-space:nowrap}.btn-back:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.05)}
.logo span{color:#c9a96e}
.user-info{display:flex;align-items:center;gap:12px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#c9a96e,#a07850);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.btn-back{background:transparent;border:1px solid var(--line);color:var(--txt-soft);padding:.55rem 1.1rem;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:500;letter-spacing:.5px;transition:all .25s ease;font-family:var(--sans);text-decoration:none;white-space:nowrap}.btn-back:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,169,110,.05)}
/* ===== Página ===== */
.wrap{max-width:920px;margin:0 auto;padding:104px 24px 96px}
.cab h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1.08;letter-spacing:-.01em;text-wrap:balance;max-width:16ch}
.cab h1 em{font-style:italic;color:var(--gold)}
.cab .sub{margin-top:16px;color:var(--txt-soft);font-size:1.0625rem;max-width:52ch;text-wrap:pretty}
.busca{margin-top:32px;position:relative;max-width:560px}
.busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);pointer-events:none}
.busca input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line-strong);background:var(--navy-2);color:var(--txt);font:400 16px var(--sans);padding:0 16px 0 46px;outline:none;transition:border-color .18s ease,background-color .18s ease}
.busca input::placeholder{color:var(--txt-mute)}
.busca input:focus-visible{border-color:var(--gold);background:var(--navy-3)}
.resumen{margin-top:16px;color:var(--txt-soft);font-size:.875rem;font-variant-numeric:tabular-nums;min-height:1.4em}
.resumen b{color:var(--txt);font-weight:600}
.saltos{display:flex;gap:8px;margin-top:32px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.saltos::-webkit-scrollbar{display:none}
.saltos a{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;color:var(--txt-soft);text-decoration:none;font-size:.875rem;transition:color .18s ease,border-color .18s ease}
.saltos a i{font:italic 500 1rem var(--serif);color:var(--gold)}
/* ===== El hilo: recorrido del negocio ===== */
.hilo{list-style:none;position:relative;margin-top:64px}
.hilo::before{content:"";position:absolute;left:21px;top:8px;bottom:0;width:1px;background:linear-gradient(180deg,var(--gold) 0%,var(--gold) 85%,rgba(201,169,110,0) 100%);transform-origin:top;animation:hilo .6s var(--expo) both}
@keyframes hilo{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.etapa{position:relative;padding-left:72px;padding-bottom:64px;scroll-margin-top:88px}
.etapa:last-child{padding-bottom:0}
.num{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:var(--navy);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font:italic 500 1.25rem var(--serif);color:var(--gold)}
.etapa h2{font-family:var(--serif);font-weight:500;font-size:1.875rem;line-height:1.2;padding-top:2px}
.etapa .que{color:var(--txt-soft);font-size:.9375rem;margin-top:4px;max-width:60ch}
.filas{list-style:none;margin-top:24px;border-top:1px solid var(--line)}
.fila{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.fila h3{font:500 1rem/1.4 var(--sans);color:var(--txt)}
.fila .uso{color:var(--txt-soft);font-size:.875rem;margin-top:4px;max-width:58ch;text-wrap:pretty}
.fila .meta{color:var(--txt-mute);font-size:.8125rem;margin-top:8px;font-variant-numeric:tabular-nums}
.fila .meta .cambiar{background:none;border:none;color:var(--gold);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px 0;margin-left:4px}
.acc{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font:600 .875rem var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap;border:1px solid transparent;transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s var(--expo)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn-oro{background:var(--gold);color:var(--navy)}
.btn-linea{background:transparent;border-color:var(--line-strong);color:var(--gold-l)}
.btn[disabled]{opacity:.55;cursor:default}
.mas{margin-top:16px;background:none;border:none;color:var(--gold);font:500 .875rem var(--sans);cursor:pointer;min-height:44px;padding:0;display:inline-flex;align-items:center;gap:8px}
.mas svg{width:16px;height:16px}
.aviso{margin-top:48px;padding:16px 0;border-top:1px solid var(--line);color:var(--txt-soft);font-size:.9375rem}
.aviso.mal{color:#f0b4b4}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (hover:hover) and (pointer:fine){
  .saltos a:hover{color:var(--txt);border-color:var(--line-strong)}
  .btn-oro:hover{background:var(--gold-l)}
  .btn-linea:hover{border-color:var(--gold);color:var(--txt)}
  .mas:hover,.fila .meta .cambiar:hover{color:var(--gold-l)}
}
/* ===== Ventana para subir ===== */
dialog{border:1px solid var(--line-strong);border-radius:16px;background:var(--navy-2);color:var(--txt);padding:0;width:min(480px,calc(100vw - 32px));margin:auto}
dialog::backdrop{background:rgba(5,10,18,.7)}
dialog[open]{animation:entra .25s var(--expo)}
@keyframes entra{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.dlg{padding:24px}
.dlg h2{font:500 1.5rem/1.2 var(--serif)}
.dlg .nota{color:var(--txt-soft);font-size:.875rem;margin-top:8px}
.campo{margin-top:16px;display:block}
.campo[hidden]{display:none}
.campo span{display:block;font-size:.8125rem;color:var(--txt-soft);margin-bottom:8px}
.campo input[type=text]{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--navy);color:var(--txt);font:400 16px var(--sans);padding:0 12px;outline:none}
.campo input[type=text]:focus-visible{border-color:var(--gold)}
.campo input[type=file]{width:100%;font:400 .875rem var(--sans);color:var(--txt-soft)}
.campo input[type=file]::file-selector-button{min-height:44px;padding:0 16px;margin-right:12px;border-radius:12px;border:1px solid var(--line-strong);background:transparent;color:var(--gold-l);font:600 .875rem var(--sans);cursor:pointer}
.dlg .estado{min-height:1.5em;margin-top:16px;font-size:.875rem;color:var(--txt-soft)}
.dlg .estado.mal{color:#f0b4b4}
.dlg .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media (max-width:640px){
  .wrap{padding:88px 24px 96px}
  .hilo::before{left:17px}
  .num{width:36px;height:36px;font-size:1.0625rem}
  .etapa{padding-left:52px;padding-bottom:48px}
  .etapa h2{font-size:1.625rem;padding-top:0}
  .fila{grid-template-columns:1fr}
  .acc{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .hilo::before,dialog[open]{animation:none}
  .btn:active{transform:none}
}
</style>
</head>
<body>
<div class="topbar"><a href="index.html" class="brand"><svg class="brand-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="none"><path d="M30 55 L30 85 L70 85 L70 55" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><path d="M22 58 L50 30 L78 58" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 35 L45 22" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><path d="M44 85 L44 70 L52 70 L52 85" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M82 55 Q83 65 84 75 Q85 82 86 88" stroke="#c9a96e" stroke-width="1.2" stroke-linecap="round"/><path d="M84 60 L80 62 M84 65 L88 67 M85 70 L81 72 M85 75 L89 77 M86 80 L82 82" stroke="#c9a96e" stroke-width="1" stroke-linecap="round"/></svg><div class="brand-text"><span class="lo">LoMaz</span><span class="ho">Home</span></div></a><div class="user-info"><a href="dashboard.html" class="btn-back">← Dashboard</a><div style="position:relative"><div class="user-avatar" id="topAvatar" title="Perfil" style="cursor:pointer">?</div><div id="topAvatarMenu" style="display:none;position:absolute;right:0;top:48px;background:#122036;border:1px solid rgba(201,169,110,.25);border-radius:12px;min-width:210px;box-shadow:0 8px 30px rgba(0,0,0,.45);overflow:hidden;z-index:9999"><div style="padding:.9rem 1.1rem;border-bottom:1px solid rgba(201,169,110,.25)"><div id="topEmail" style="font-size:.9rem;color:#f5f1ea;font-weight:600;white-space:nowrap">&nbsp;</div><div id="topRole" style="font-size:.7rem;color:#c9a96e;letter-spacing:1px;text-transform:uppercase;margin-top:2px">&nbsp;</div></div><a href="perfil-asesor.html" style="display:block;padding:.75rem 1.1rem;color:#e8e8ea;text-decoration:none;font-size:.88rem">Mi Perfil</a><a href="mis-propiedades.html" style="display:block;padding:.75rem 1.1rem;color:#e8e8ea;text-decoration:none;font-size:.88rem;border-top:1px solid rgba(255,255,255,.06)">Mis Propiedades</a><a href="clientes.html" style="display:block;padding:.75rem 1.1rem;color:#e8e8ea;text-decoration:none;font-size:.88rem;border-top:1px solid rgba(255,255,255,.06)">Clientes</a><a href="#" id="topLogoutBtn" style="display:block;padding:.75rem 1.1rem;color:#e57373;text-decoration:none;font-size:.88rem;border-top:1px solid rgba(255,255,255,.06)">Cerrar Sesion</a></div></div><script>(function(){function fmtRol(r){if(!r)return"Usuario";var map={admin:"Administrador",administrador:"Administrador",coordinador:"Coordinador",asesor:"Asesor Inmobiliario",asesor_inmobiliario:"Asesor Inmobiliario",externo:"Externo"};var k=String(r).toLowerCase();return map[k]||(r.charAt(0).toUpperCase()+r.slice(1));}async function fillTop(){try{var s=(await sb.auth.getSession()).data.session;if(!s)return;var email=s.user.email||"";var av=document.getElementById("topAvatar");if(av&&email)av.textContent=email.charAt(0).toUpperCase();var r=await sb.from("perfiles_usuarios").select("nombre_completo,rol_id,roles(nombre)").eq("id",s.user.id).single();var p=r.data;if(p){var nombre=(p.nombre_completo||"").trim();if(nombre){document.getElementById("topEmail").textContent=nombre;if(av)av.textContent=nombre.charAt(0).toUpperCase();}var rn=p.roles&&p.roles.nombre?p.roles.nombre:null;document.getElementById("topRole").textContent=fmtRol(rn);}}catch(e){}}(function w(){if(typeof sb!=='undefined'&&sb&&sb.from){fillTop();}else{setTimeout(w,150);}})();var av=document.getElementById("topAvatar"),mn=document.getElementById("topAvatarMenu");if(av){av.addEventListener("click",function(e){e.stopPropagation();mn.style.display=(mn.style.display==="none")?"block":"none";});document.addEventListener("click",function(){mn.style.display="none";});}var lo=document.getElementById("topLogoutBtn");if(lo){lo.addEventListener("click",function(e){e.preventDefault();try{Object.keys(localStorage).filter(function(x){return /sb-.*-auth-token/.test(x)}).forEach(function(x){localStorage.removeItem(x);});}catch(_){}window.location.href="login.html";});}})();</script></div></div>
<main class="wrap">
  <header class="cab">
    <h1>Cada etapa del negocio, con su <em>formato</em></h1>
    <p class="sub">Descarga el documento que toca en cada momento, de la captación al cobro de la comisión.</p>
    <div class="busca">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" autocomplete="off" aria-label="Buscar un formato" placeholder="Busca un formato: promesa, inventario, cuenta de cobro"/>

</dialog>

<script>
const SB_URL="https://lniouebpuuuqctrgxoiw.supabase.co";
const SB_KEY=atob("ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW14dWFXOTFaV0p3ZFhWMWNXTjBjbWQ0YjJsM0lpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzTnpnd09ETTVOamdzSW1WNGNDSTZNakE1TXpZMU9UazJPSDAuOHctVGNEOEpLa0hRcG55YmFqLUFOei00azRoem5Gb0l3RnJfWmF0cVB0QQ==");
const sb=supabase.createClient(SB_URL,SB_KEY);
/* ============================================================
   Formatos — cómo funciona esta página
   1. Lee la tabla «formatos» de Supabase (solo usuarios del equipo).
   2. Los agrupa por etapa del negocio y los pinta sobre el hilo dorado.
   3. Cada archivo vive en el depósito privado «formatos»; para descargar
      se pide un enlace temporal de 60 segundos.
   4. Subir o cambiar un archivo actualiza la fila del formato.
   ============================================================ */
var ETAPAS=[
  {k:"captacion",     n:"I",   t:"Captación",           d:"Del primer contacto con el propietario a la firma del encargo."},
  {k:"venta",         n:"II",  t:"Venta",               d:"De la oferta del comprador a la entrega de llaves."},
  {k:"arriendo",      n:"III", t:"Arriendo",            d:"Del contrato a la restitución del inmueble."},
  {k:"administracion",n:"IV",  t:"Administración",      d:"Lo que firmas y reportas al propietario cada mes."},
  {k:"cobros",        n:"V",   t:"Cobro de comisiones", d:"Cada peso que entra y sale, con su consecutivo."}
];
var TIPOS={docx:"Word",doc:"Word",xlsx:"Excel",xls:"Excel",pdf:"PDF"};
var MAX=10*1024*1024;
var formatos=[], usuario=null, enCurso=null;
var IC_BAJAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>';
var IC_SUBIR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V9M7.5 13L12 8.5l4.5 4.5M5 4h14"/></svg>';
var IC_IR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 16l8-8M9.5 8H16v6.5"/></svg>';
var IC_MAS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function plano(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function fecha(d){try{return new Date(d).toLocaleDateString("es-CO",{day:"numeric",month:"short",year:"numeric"});}catch(e){return "";}}
function archivosDe(f){return Array.isArray(f.archivos)?f.archivos:[];}
function enlaceSeguro(u){u=String(u||"");return /^(https:\/\/|[a-z0-9\-]+\.html)/i.test(u)?u:"";}

function filaHTML(f){
  var h='<li class="fila" data-id="'+f.id+'"><div><h3>'+esc(f.nombre)+'</h3>';
  if(f.uso) h+='<p class="uso">'+esc(f.uso)+'</p>';
  var acc='';
  if(f.tipo==="herramienta"){
    var u=enlaceSeguro(f.enlace), fuera=/^https:/i.test(u);
    if(u) acc='<a class="btn btn-linea" href="'+esc(u)+'"'+(fuera?' target="_blank" rel="noopener"':'')+'>'+esc(f.enlace_texto||"Abrir herramienta")+IC_IR+'</a>';
    h+='<p class="meta">Se hace en línea, sin archivo</p>';
  }else{
    var a=archivosDe(f);
    if(a.length){
      var ult=a.map(function(x){return x.fecha;}).sort().pop();
      h+='<p class="meta">'+a.map(function(x){return esc(TIPOS[x.ext]||x.ext);}).join(" y ")+' · actualizado el '+esc(fecha(ult))+' · <button type="button" class="cambiar" data-subir="'+f.id+'">Cambiar archivo</button></p>';
      a.forEach(function(x,i){
        acc+='<button type="button" class="btn '+(i===0?'btn-oro':'btn-linea')+'" data-bajar="'+f.id+'" data-i="'+i+'">'+IC_BAJAR+'Descargar '+esc(TIPOS[x.ext]||x.ext)+'</button>';
      });
    }else{
      h+='<p class="meta">Sin archivo todavía</p>';
      acc='<button type="button" class="btn btn-linea" data-subir="'+f.id+'">'+IC_SUBIR+'Subir archivo</button>';
    }
  }
  return h+'</div><div class="acc">'+acc+'</div></li>';
}

function pintar(){
  var q=plano($("q").value.trim());
  var html="", visibles=0;
  ETAPAS.forEach(function(e){
    var filas=formatos.filter(function(f){return f.proceso===e.k && (!q || plano(f.nombre+" "+(f.uso||"")+" "+e.t).indexOf(q)>=0);});
    if(q && !filas.length) return;
    visibles+=filas.length;
    html+='<li class="etapa" id="'+e.k+'"><div class="num" aria-hidden="true">'+e.n+'</div><h2>'+esc(e.t)+'</h2><p class="que">'+esc(e.d)+'</p><ul class="filas">'+filas.map(filaHTML).join("")+'</ul>'+(q?'':'<button type="button" class="mas" data-nuevo="'+e.k+'">'+IC_MAS+'Agregar formato a '+esc(e.t)+'</button>')+'</li>';
  });
  $("lista").innerHTML=html;
  var av=$("aviso");
  if(q && !visibles){av.hidden=false;av.className="aviso";av.textContent="Ningún formato coincide con «"+$("q").value.trim()+"». Prueba con otra palabra.";}
  else if(!av.classList.contains("mal")){av.hidden=true;}
  var listos=formatos.filter(function(f){return f.tipo==="archivo"&&archivosDe(f).length;}).length;
  var herr=formatos.filter(function(f){return f.tipo==="herramienta";}).length;
  var falt=formatos.length-listos-herr;
  $("resumen").innerHTML=formatos.length?('<b>'+formatos.length+'</b> formatos · <b>'+listos+'</b> listos para descargar · <b>'+herr+'</b> en línea'+(falt?' · <b>'+falt+'</b> sin archivo':'')):'';
}

async function cargar(){
  var r=await sb.from("formatos").select("*").eq("activo",true).order("orden",{ascending:true}).order("id",{ascending:true});
  if(r.error){var av=$("aviso");av.hidden=false;av.className="aviso mal";av.textContent="No se pudieron cargar los formatos: "+r.error.message;return;}
  formatos=r.data||[];
  $("aviso").className="aviso";
  pintar();
}

async function bajar(id,i,boton){
  var f=formatos.find(function(x){return String(x.id)===String(id);}); if(!f) return;
  var a=archivosDe(f)[i]; if(!a) return;
  boton.disabled=true;
  var r=await sb.storage.from("formatos").createSignedUrl(a.ruta,60,{download:a.nombre});
  boton.disabled=false;
  if(r.error||!r.data||!r.data.signedUrl){var av=$("aviso");av.hidden=false;av.className="aviso mal";av.textContent="No se pudo descargar «"+f.nombre+"»: "+(r.error?r.error.message:"sin enlace");return;}
  var l=document.createElement("a");l.href=r.data.signedUrl;l.download=a.nombre;document.body.appendChild(l);l.click();l.remove();
}

function abrirDlg(modo,ref){
  enCurso={modo:modo,ref:ref};
  var nuevo=modo==="nuevo";
  var f=nuevo?null:formatos.find(function(x){return String(x.id)===String(ref);});
  var etapa=nuevo?ETAPAS.find(function(e){return e.k===ref;}):null;
  $("dlgTitulo").textContent=nuevo?("Formato nuevo en "+etapa.t):f.nombre;
  $("dlgNota").textContent=nuevo?"Queda disponible para todo el equipo apenas lo subas.":"Si ya hay un archivo del mismo tipo (Word, Excel o PDF), este lo reemplaza.";
  $("campoNombre").hidden=!nuevo;$("campoUso").hidden=!nuevo;
  $("fNombre").value="";$("fUso").value="";$("fArchivo").value="";
  $("dlgEstado").textContent="";$("dlgEstado").className="estado";$("dlgSubir").disabled=false;
  $("dlg").showModal();
}
function estado(t,mal){$("dlgEstado").textContent=t;$("dlgEstado").className="estado"+(mal?" mal":"");}
function rutaLimpia(nombre){return plano(nombre).replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80);}

async function guardar(ev){
  ev.preventDefault();
  if(!enCurso) return;
  var archivo=$("fArchivo").files[0];
  var nuevo=enCurso.modo==="nuevo";
  var nombre=$("fNombre").value.trim();
  if(nuevo && !nombre) return estado("Escribe el nombre del formato.",true);
  if(!archivo) return estado("Elige el archivo que vas a subir.",true);
  var ext=(archivo.name.split(".").pop()||"").toLowerCase();
  if(!TIPOS[ext]) return estado("Ese tipo de archivo no sirve aquí. Usa Word, Excel o PDF.",true);
  if(archivo.size>MAX) return estado("El archivo pesa más de 10 MB.",true);
  $("dlgSubir").disabled=true;estado("Subiendo…");
  var f;
  if(nuevo){
    var orden=formatos.filter(function(x){return x.proceso===enCurso.ref;}).reduce(function(m,x){return Math.max(m,x.orden||0);},0)+10;
    var ins=await sb.from("formatos").insert({proceso:enCurso.ref,orden:orden,nombre:nombre,uso:$("fUso").value.trim()||null,tipo:"archivo",actualizado_por:usuario.id}).select().single();
    if(ins.error){$("dlgSubir").disabled=false;return estado("No se pudo crear el formato: "+ins.error.message,true);}
    f=ins.data;
  }else{
    f=formatos.find(function(x){return String(x.id)===String(enCurso.ref);});
  }
  var ruta=f.id+"/"+Date.now()+"-"+rutaLimpia(archivo.name);
  var up=await sb.storage.from("formatos").upload(ruta,archivo,{upsert:false,contentType:archivo.type||"application/octet-stream"});
  if(up.error){$("dlgSubir").disabled=false;return estado("No se pudo subir el archivo: "+up.error.message,true);}
  var antes=archivosDe(f), mismoTipo=antes.filter(function(x){return TIPOS[x.ext]===TIPOS[ext];});
  var lista=antes.filter(function(x){return TIPOS[x.ext]!==TIPOS[ext];});
  lista.push({ruta:ruta,nombre:archivo.name,ext:ext,tam:archivo.size,fecha:new Date().toISOString()});
  lista.sort(function(a,b){return (a.ext==="pdf")-(b.ext==="pdf");}); /* el editable primero, el PDF después */
  var upd=await sb.from("formatos").update({archivos:lista,actualizado_en:new Date().toISOString(),actualizado_por:usuario.id}).eq("id",f.id);
  if(upd.error){await sb.storage.from("formatos").remove([ruta]);$("dlgSubir").disabled=false;return estado("El archivo subió, pero no se pudo guardar en la lista: "+upd.error.message,true);}
  if(mismoTipo.length) await sb.storage.from("formatos").remove(mismoTipo.map(function(x){return x.ruta;}));
  $("dlg").close();
  await cargar();
}

document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-bajar],[data-subir],[data-nuevo]"); if(!b) return;
  if(b.dataset.bajar) bajar(b.dataset.bajar,Number(b.dataset.i),b);
  else if(b.dataset.subir) abrirDlg("subir",b.dataset.subir);
  else abrirDlg("nuevo",b.dataset.nuevo);
});
$("q").addEventListener("input",pintar);
$("dlgForm").addEventListener("submit",guardar);
$("dlgCancelar").addEventListener("click",function(){$("dlg").close();});
$("saltos").innerHTML=ETAPAS.map(function(e){return '<a href="#'+e.k+'"><i>'+e.n+'</i>'+esc(e.t)+'</a>';}).join("");

(async function init(){
  try{
    var s=await sb.auth.getSession();
    usuario=(s&&s.data&&s.data.session)?s.data.session.user:null;
  }catch(e){usuario=null;}
  if(!usuario){window.location.href="login.html";return;}
  await cargar();
  if(location.hash){var d=document.getElementById(location.hash.slice(1));if(d)d.scrollIntoView();}
})();
</script>
<script src="lomaz-admin-nav.js" defer></script>
</body>
